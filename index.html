*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4eee2;font-family:"WK","PingFang SC","KaiTi",sans-serif;color:#3b2416;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.hero{position:relative;padding:22px 18px 18px;background:linear-gradient(160deg,#5a2412,#3b2416);color:#f6ead2;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:170px;height:170px;opacity:.18;background:
 linear-gradient(#f6ead2,#f6ead2) 50% 0/6px 100% no-repeat,linear-gradient(#f6ead2,#f6ead2) 0 50%/100% 6px no-repeat,
 linear-gradient(45deg,transparent 47%,#f6ead2 47% 53%,transparent 53%),linear-gradient(-45deg,transparent 47%,#f6ead2 47% 53%,transparent 53%);border:6px solid #f6ead2}
.hero .row{display:flex;align-items:center;gap:12px}
.seal{width:48px;height:48px;background:#b3261e;color:#fbe9d2;font-family:"MSZ","KaiTi";font-size:34px;display:flex;align-items:center;justify-content:center;border-radius:5px;box-shadow:inset 0 0 0 2px #fbe9d2,inset 0 0 0 4px #b3261e;flex:none}
h1{margin:0;font-family:"MSZ","KaiTi";font-weight:normal;font-size:34px;letter-spacing:4px}
.hero p{margin:4px 0 0;font-size:14px;opacity:.85;letter-spacing:1px}
#status{margin-top:14px;font-size:14px;display:flex;align-items:center;gap:8px;opacity:.95}
#status i{width:9px;height:9px;border-radius:50%;background:#e2a33a;display:inline-block}
#status i.ok{background:#4cc27a;box-shadow:0 0 0 3px rgba(76,194,122,.3)}
#status b{letter-spacing:2px;font-family:Menlo,monospace}
.chg{font-size:13px;opacity:.7;text-decoration:underline;margin-left:auto}
.card{margin:14px 14px;padding:16px;background:#fffaf0;border:1px solid #e4d3ae;border-radius:6px;box-shadow:0 6px 18px rgba(80,40,10,.08)}
.card h2{margin:0 0 12px;font-size:19px;font-weight:normal;display:flex;align-items:center;gap:8px;letter-spacing:1px}
.card h2 b{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;background:#b3261e;color:#fff;font-size:15px;font-family:Georgia,serif}
.row2{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px;border:1px solid #c9a04a;border-radius:6px;background:#fff;color:#3b2416;-webkit-appearance:none}
.btn{display:block;width:100%;font:inherit;font-size:19px;padding:14px;border:1px solid #c9a04a;border-radius:6px;background:#fbf4e6;color:#3b2416;text-align:center;letter-spacing:2px}
.btn.red{background:linear-gradient(180deg,#c83a26,#a02418);color:#fff6e8;border-color:#7a1a10;box-shadow:0 6px 16px rgba(160,36,24,.3)}
.btn:disabled{opacity:.5}
.btn:active{transform:scale(.98)}
.mini{display:flex;gap:8px;margin-top:10px}.mini .btn{font-size:15px;padding:10px;letter-spacing:0}
#stage{border-radius:6px;overflow:hidden;background:#2a1c14;touch-action:none;margin-top:12px}
#cv{display:block;width:100%}
.hint{font-size:14px;color:#7a5a40;margin:10px 2px 0;line-height:1.6}
.pv{position:relative;background:linear-gradient(#dbe9f2,#eef2e6 65%,#c9d8b8);border-radius:6px;padding:14px;text-align:center}
#win{max-width:78%;box-shadow:0 10px 24px rgba(40,20,8,.35)}
#pvWait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,250,240,.7);font-size:16px}
#pvMsg{font-size:14px;color:#7a5a40;text-align:center;margin-top:10px}
.hide{display:none!important}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.92);padding:16px 22px;background:rgba(59,36,22,.95);color:#fff;border-radius:10px;font-size:18px;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:86vw;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.done{position:fixed;inset:0;background:rgba(244,238,226,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;text-align:center}
.done .big{font-family:"MSZ","KaiTi";font-size:56px;color:#b3261e;letter-spacing:8px}
.done p{font-size:20px;color:#5a3a24;line-height:1.7}
.done .btn{width:auto;padding:12px 34px;margin-top:20px}
.foot{text-align:center;font-size:12px;color:#a08870;margin:6px 0 24px}
</style></head><body>
<div class="hero"><div class="row"><div class="seal">窗</div><div><h1>送窗上墙</h1><p>岭南窗韵 · 满洲窗数字展厅</p></div></div>
<div id="status"><i></i>正在连接展厅…<span class="chg hide"></span></div></div>

<div class="card hide" id="roomCard"><h2><b>0</b>输入展厅码</h2><p class="hint" style="margin-top:0">展厅码在大屏幕右下角二维码下面（6 位）</p>
<div class="row2"><input type="text" id="roomIn" placeholder="例如 K7M 2QD" maxlength="7" autocapitalize="characters" autocomplete="off"><button class="btn red" id="roomGo" style="width:auto;padding:12px 22px">进入</button></div></div>

<div id="main" class="hide">
<div class="card"><h2><b>1</b>写上名字<span style="margin-left:auto;font-size:13px;color:#a08870">展厅码 <b id="roomShow" style="color:#3b2416;background:none;width:auto;font-family:Menlo,monospace;letter-spacing:2px"></b> · <u id="chg">换</u></span></h2>
<div class="row2"><input type="text" id="name" placeholder="姓名" maxlength="8"><input type="text" id="title" placeholder="作品名（可不填）" maxlength="10"></div></div>

<div class="card"><h2><b>2</b>拍下你的满洲窗</h2>
<label class="btn red" for="file" id="shotLbl">📷 拍照 / 选照片</label>
<input type="file" id="file" accept="image/*" class="hide">
<p class="hint">纸放平、光线亮，方格区四个角都拍进去。</p>
<div id="adjust" class="hide"><div id="stage"><canvas id="cv"></canvas></div>
<p class="hint">四个红点要对准<b>方格区的四个角</b>，没对准就用手指拖一拖。</p>
<div class="mini"><button class="btn" id="redetect">重新找角</button><button class="btn" id="rotate">转 90°</button></div></div></div>

<div class="card hide" id="step3"><h2><b>3</b>看看上墙效果</h2>
<div class="pv"><canvas id="win"></canvas><div id="pvWait">正在做成满洲窗…</div></div>
<div id="pvMsg"></div><p class="hint" style="text-align:center;margin-top:4px">黑线变实木窗棂，原样平移复制成 2 列 × 3 行</p></div>

<div class="card hide" id="step4"><button class="btn red" id="send">送窗上墙 ✨</button></div>
</div>
<div class="foot">照片经加密传到展厅电脑，只用于本节课展示</div>
<div class="done hide" id="done"><div class="big" id="doneT">上墙啦！</div><p id="doneS">抬头看看大屏幕 ✨</p><button class="btn red" id="again">再送一扇</button></div>
